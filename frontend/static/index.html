<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UrbanNest Concierge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #4f46e5;
    --accent-light: #6366f1;
    --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    --header-bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.05);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    background: var(--header-bg);
    color: #ffffff;
    padding: 1.1rem 1.8rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-md);
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .brand-logo {
    width: 38px;
    height: 38px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .brand-logo span {
    color: #a5b4fc;
    font-size: 1.5rem;
  }

  .brand-title {
    font-family: 'Outfit', sans-serif;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .brand-subtitle {
    font-size: 0.75rem;
    color: #a5b4fc;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(255, 255, 255, 0.08);
    padding: 0.35rem 0.8rem;
    border-radius: 9999px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 0.8rem;
    font-weight: 500;
    color: #e0e7ff;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 8px #10b981;
  }

  #main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    overflow: hidden;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  .msg {
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.25s ease-out forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-items: flex-end; }
  .msg.agent { align-items: flex-start; }

  .bubble {
    padding: 0.85rem 1.2rem;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    color: var(--text-primary);
    max-width: 88%;
    line-height: 1.55;
    font-size: 0.95rem;
    white-space: pre-wrap;
  }

  .msg.user .bubble {
    background: var(--accent-gradient);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: var(--shadow-md);
  }

  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  .suggestions {
    display: flex;
    gap: 0.5rem;
    padding: 0.5rem 1rem 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .suggestions::-webkit-scrollbar { display: none; }

  .chip {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.45rem 0.9rem;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
  }

  .chip:hover {
    border-color: var(--accent-light);
    color: var(--accent);
    background: #f5f3ff;
    transform: translateY(-1px);
  }

  form {
    display: flex;
    gap: 0.75rem;
    padding: 1rem 1.2rem 1.2rem;
    background: transparent;
  }

  .input-container {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }

  input {
    width: 100%;
    padding: 0.9rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #ffffff;
    color: var(--text-primary);
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }

  input:focus {
    outline: none;
    border-color: var(--accent-light);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }

  button {
    padding: 0.9rem 1.5rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-weight: 600;
    font-family: 'Outfit', sans-serif;
    font-size: 0.95rem;
    cursor: pointer;
    box-shadow: var(--shadow-md);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  button:hover {
    opacity: 0.95;
    transform: translateY(-1px);
    box-shadow: var(--shadow-lg);
  }

  /* --- Rich A2UI Component Enhancements --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    background: #ffffff;
    box-shadow: var(--shadow-md);
    width: 100%;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .a2card:hover {
    box-shadow: var(--shadow-lg);
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.8rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.6rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }

  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 700; color: #1e1b4b; }
  .a2text.a2-h2 { font-family: 'Outfit', sans-serif; font-size: 1.3rem; font-weight: 700; color: #1e1b4b; }
  .a2text.a2-h3 { font-family: 'Outfit', sans-serif; font-size: 1.15rem; font-weight: 600; color: #312e81; }
  .a2text.a2-h4 { font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }

  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { width: 100%; border-radius: 12px; display: block; object-fit: cover; max-height: 320px; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.3rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-logo">
      <span class="material-symbols-outlined">apartment</span>
    </div>
    <div>
      <div class="brand-title">UrbanNest Concierge</div>
      <div class="brand-subtitle">AI Real Estate Assistant</div>
    </div>
  </div>
  <div class="status-badge">
    <div class="status-dot"></div>
    Agent Online
  </div>
</header>

<div id="main-wrapper">
  <div id="log"></div>

  <div class="suggestions">
    <div class="chip" onclick="sendPrompt('Show available apartments in Chicago')">🏢 Show Chicago flats</div>
    <div class="chip" onclick="sendPrompt('Find flats within 1 km of a hospital')">🏥 Near hospital (1km)</div>
    <div class="chip" onclick="sendPrompt('Calculate affordability for $3000 budget')">💰 Affordability check</div>
    <div class="chip" onclick="sendPrompt('Generate interior view of apt-101')">✨ Interior preview</div>
  </div>

  <form id="form">
    <div class="input-container">
      <input id="input" placeholder="Ask UrbanNest about flats, hospitals, budget..." autocomplete="off" autofocus>
    </div>
    <button>
      <span>Send</span>
      <span class="material-symbols-outlined" style="font-size: 1.1rem; color: #fff;">send</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit"));
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// Display a warm welcome message when the chat window opens
window.addEventListener("DOMContentLoaded", () => {
  const b = bubble("agent");
  b.innerHTML = `<strong>Welcome to UrbanNest Concierge! 👋</strong><br><br>` +
    `Whatever you're looking for in your ideal property — whether it's a sleek downtown loft, a spacious family home, or an apartment within 1 km of top medical centers — <strong>you've come to the right place and we'll help you find it!</strong><br><br>` +
    `How can I assist your real estate search today? Select a suggestion below or type your inquiry.`;
});

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
